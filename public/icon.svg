<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Subtle geometric grid pattern -->
  <path d="M64 128h384M64 256h384M64 384h384M128 64v384M256 64v384M384 64v384" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Glowing circle ring -->
  <circle cx="256" cy="256" r="180" stroke="rgba(255,255,255,0.15)" stroke-width="4" fill="none" stroke-dasharray="8 8"/>
  
  <!-- Core Math Shield / Diamond -->
  <g filter="url(#shadow)">
    <!-- Mathematical symbols composition: Pi, Sigma, Square root, Delta -->
    <path d="M140 330 L180 330 L220 370 L280 160 L380 160" fill="none" stroke="url(#gold)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Pi Symbol & Summation -->
    <text x="210" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" fill="#ffffff" opacity="0.95">∑</text>
    <text x="290" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="70" font-weight="900" fill="#67e8f9" opacity="0.95">π</text>
    <text x="320" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#f43f5e">x²</text>
    
    <!-- Math Compass / Trophy Accent -->
    <circle cx="256" cy="110" r="16" fill="#facc15"/>
    <path d="M256 126 L230 180 M256 126 L282 180" stroke="#facc15" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Little sparkles -->
  <circle cx="120" cy="140" r="6" fill="#fef08a"/>
  <circle cx="390" cy="380" r="6" fill="#fef08a"/>
  <circle cx="130" cy="380" r="5" fill="#67e8f9"/>
  <circle cx="390" cy="130" r="5" fill="#a78bfa"/>
</svg>
